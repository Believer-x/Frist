<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕桥</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="brand">译<span>CC</span></div><div><h1>字幕桥</h1><p>听见世界，看懂每一句。</p></div><label class="switch" title="自动翻译"><input id="enabled" type="checkbox" aria-label="开启自动翻译"><span></span></label></header>
<main><div class="intro"><span class="dot"></span> 视频字幕 · 自动识别 · 双语呈现</div>
<form id="settings">
<div class="row"><label>原字幕语言<select id="source"><option value="auto">自动检测</option><option value="en">英语</option><option value="zh-CN">中文</option><option value="ja">日语</option><option value="ko">韩语</option><option value="es">西班牙语</option><option value="fr">法语</option><option value="de">德语</option></select></label><span class="arrow">→</span><label>翻译为<select id="target"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></label></div>
<label class="check"><input id="bilingual" type="checkbox"> 同时显示原字幕</label>
<div class="divider"></div><label>翻译服务<select id="provider"><option value="google">Google 公共翻译（免密钥）</option><option value="libre">LibreTranslate / 自建服务</option></select></label>
<div id="custom" hidden><label>服务地址<input id="endpoint" type="url" placeholder="https://translate.example.com"></label><label>API Key（可选）<input id="apiKey" type="password" autocomplete="off" placeholder="仅保存在本机扩展中"></label><p class="hint">仅向此服务发送字幕和密钥。自建 HTTP 服务仅支持 localhost / 127.0.0.1。</p></div>
<p id="privacy" class="hint">开启后，识别到的字幕文本会发送给 Google 公共翻译接口。此接口非正式 API，可能限流或不可用；也可切换自建服务。</p>
<button type="submit">保存并应用 <span>↗</span></button><p id="status" role="status" aria-live="polite"></p>
</form>
<div class="tip"><b>开始使用</b><p>先开启网站播放器的字幕，再播放视频。支持标准 HTML5 字幕轨道，以及部分主流播放器的网页字幕。</p><p>需要网站已有字幕；暂不识别音频、画面中的硬字幕或直播语音。</p></div></main><footer>SUBTITLE BRIDGE <span>让语言不再成为距离</span></footer>
<script type="module" src="popup.js"></script></body></html>
